[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "cd frontend && npm ci --legacy-peer-deps",
  "cd ../backend && npm ci --legacy-peer-deps"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "mkdir -p backend/public",
  "cp -r frontend/dist/frontend/browser/* backend/public/"
]

[start]
cmd = "cd backend && node src/index.js"
