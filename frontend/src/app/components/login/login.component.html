<div class="login-container">
  <button class="theme-toggle" (click)="themeService.toggleTheme()">
    {{ themeService.isDarkMode() ? '☀️' : '🌙' }}
  </button>

  <div class="login-card">
    <button (click)="volverAlHome()" class="btn-home">← Volver al Home</button>
    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Sistema de Gestión de Peluquería</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          class="form-control"
          placeholder="tu@email.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          class="form-control"
          placeholder="••••••••"
        />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="!loginForm.valid || loading"
      >
        {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="forgot-password-link">
      <a routerLink="/recuperar-password">¿Olvidaste tu contraseña?</a>
    </div>

    <div class="register-link">
      ¿No tienes cuenta?
      <a routerLink="/registro">Regístrate aquí</a>
    </div>
  </div>
</div>
